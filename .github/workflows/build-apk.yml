name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Android permissions for reminders
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' \
            'org.gradle.daemon=false' \
            'systemProp.org.gradle.internal.repository.max.retries=8' \
            'systemProp.org.gradle.internal.repository.initial.backoff=2000' \
            'systemProp.org.gradle.internal.http.connectionTimeout=120000' \
            'systemProp.org.gradle.internal.http.socketTimeout=120000' \
            > ~/.gradle/gradle.properties
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
            buildscript {
              repositories {
                maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }
                maven { url 'https://maven.google.com' }
              }
            }
            repositories {
              maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }
              maven { url 'https://maven.google.com' }
            }
          }
          EOF
          chmod +x android/gradlew
          cd android
          n=0
          until ./gradlew assembleDebug --no-daemon; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "Gradle failed (often a Maven rate limit). Retry $n in 25s"
            sleep 25
          done
      - uses: actions/upload-artifact@v4
        with:
          name: NQT-Daily-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
